    - heading "Transparent Translate" [level=1] [ref=f4e4]
    - paragraph [ref=f4e5]:
      - text: Write your Obsidian notes in any mix of German and English, then read them in either language with one click.
      - strong [ref=f4e6]: The file on disk never changes.
    - paragraph [ref=f4e7]:
      - link "Download the latest release" [ref=f4e8] [cursor=pointer]:
        - /url: https://github.com/CodingJinxx/transparent-translate/releases/latest
      - link "Source on GitHub" [ref=f4e9] [cursor=pointer]:
        - /url: https://github.com/CodingJinxx/transparent-translate
  - main [ref=f4e10]:
    - region [ref=f4e11]:
      - heading "Demo" [level=2] [ref=f4e12]
      - figure [ref=f4e13]:
        - 'img "Demo in Obsidian: a German lecture note switches to English and then to German with a short decode animation. In Live Preview, clicking a translated sentence opens the original for editing. A right-click on a sentence opens Fix translation, where the term Laufzeit is set to running time and every sentence with that term updates. Finally the file explorer shows the folder Informatik as Computer science and the note Lektion 1 as Lesson 1, without renaming anything." [ref=f4e15]'
        - generic [ref=f4e16]:
          - text: Recorded in a real Obsidian with a mock translator, 40 seconds.
          - link "Open the animation on its own" [ref=f4e17] [cursor=pointer]:
            - /url: demo.gif
          - text: .
      - generic [ref=f4e18]:
        - button "Play music" [ref=f4e19] [cursor=pointer]
        - paragraph [ref=f4e20]: Off unless you turn it on. Starting it restarts the demo, so each scene begins on a bar of the music.
    - region [ref=f4e21]:
      - heading "What it does" [level=2] [ref=f4e22]
      - list [ref=f4e23]:
        - listitem [ref=f4e24]:
          - heading "Display only" [level=3] [ref=f4e25]
          - paragraph [ref=f4e26]: Original, English and German are views. A mode switch or a translation never rewrites your Markdown, so search, backlinks and sync keep seeing what you wrote.
        - listitem [ref=f4e27]:
          - heading "Mixed-language notes" [level=3] [ref=f4e28]
          - paragraph [ref=f4e29]: Sentences are translated one by one, so a paragraph that switches language halfway comes out fully in the target language.
        - listitem [ref=f4e30]:
          - heading "Syntax stays intact" [level=3] [ref=f4e31]
          - paragraph [ref=f4e32]: Links, embeds, tags, math, code, footnotes and frontmatter are protected and never sent for rewriting.
        - listitem [ref=f4e33]:
          - heading "Edit in translated views" [level=3] [ref=f4e34]
          - paragraph [ref=f4e35]: Click a translated sentence to edit it, in Reading view or Live Preview. Every change is a normal editor change that undo reverts.
        - listitem [ref=f4e36]:
          - heading "A glossary that learns" [level=3] [ref=f4e37]
          - paragraph [ref=f4e38]: Fix a term once from the right-click menu and it applies to every sentence that contains it, per note, folder, tag or vault.
        - listitem [ref=f4e39]:
          - heading "File and folder names" [level=3] [ref=f4e40]
          - paragraph [ref=f4e41]: Optionally show translated names in the explorer, tabs and titles. Nothing is ever renamed.
        - listitem [ref=f4e42]:
          - heading "Bring your own model" [level=3] [ref=f4e43]
          - paragraph [ref=f4e44]: "Any OpenAI-compatible endpoint: a local server such as LM Studio, or a cloud provider. Each sentence is translated once and cached in your vault."
        - listitem [ref=f4e45]:
          - heading "Works on mobile" [level=3] [ref=f4e46]
          - paragraph [ref=f4e47]: Phones and tablets show translations made on a desktop and synced. They never call an API and need no key.
      - figure [ref=f4e48]:
        - img "The Fix translation dialog with the original sentence, its translation, the selected term Laufzeit and the replacement running time." [ref=f4e49]
        - img "The file explorer shows the folder Informatik as Computer science and the note Lektion 1 as Lesson 1, next to the note in English." [ref=f4e50]
    - region [ref=f4e51]:
      - heading "Install" [level=2] [ref=f4e52]
      - paragraph [ref=f4e53]: Requires Obsidian 1.11.4 or later.
      - heading "From Obsidian" [level=3] [ref=f4e54]
      - paragraph [ref=f4e55]: "Once the plugin is listed in the community directory: Settings → Community plugins → Browse, search for \"Transparent Translate\", then Install and Enable."
      - heading "Manually" [level=3] [ref=f4e56]
      - list [ref=f4e57]:
        - listitem [ref=f4e58]:
          - text: Download
          - code [ref=f4e59]: main.js
          - text: ","
          - code [ref=f4e60]: manifest.json
          - text: and
          - code [ref=f4e61]: styles.css
          - text: from the
          - link "latest release" [ref=f4e62] [cursor=pointer]:
            - /url: https://github.com/CodingJinxx/transparent-translate/releases/latest
          - text: .
        - listitem [ref=f4e63]:
          - text: Copy them to
          - code [ref=f4e64]: <your vault>/.obsidian/plugins/transparent-translate/
          - text: .
        - listitem [ref=f4e65]: Reload Obsidian and enable Transparent Translate under Settings → Community plugins.
      - heading "Set up" [level=3] [ref=f4e66]
      - paragraph [ref=f4e67]: Open Settings → Transparent Translate, pick a provider (LM Studio, OpenAI, OpenRouter, Meta Model API or any OpenAI-compatible endpoint), choose a model and select Test. Then open a note and select the language button in its header.
      - paragraph [ref=f4e68]:
        - text: "Privacy: when you switch a note to English or German, the text of its sentences is sent to the endpoint you configure, and only there. With a local server nothing leaves your computer. The plugin has no telemetry. See"
        - link "Privacy and network use" [ref=f4e69] [cursor=pointer]:
          - /url: https://github.com/CodingJinxx/transparent-translate#privacy-and-network-use
        - text: .
