name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (eslint-plugin-obsidianmd)
        run: npm run lint
      - name: Plugin guideline check
        run: npm run check:guidelines
      - name: Unit tests
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - if: matrix.node == '24.x'
        uses: actions/upload-artifact@v7
        with:
          name: plugin-build
          path: |
            main.js
            manifest.json
            styles.css
          retention-days: 14

  e2e:
    name: End-to-end (Obsidian)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build

      # The Obsidian versions to test (minAppVersion and latest) decide the cache key.
      - name: Resolve Obsidian versions
        run: |
          npx tsx wdio.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt || true
          rm -rf .obsidian-cache
        env:
          CI: 'true'
          TT_MOCK_PORT: '0'
      - uses: actions/cache@v6
        with:
          path: .obsidian-cache
          key: obsidian-${{ runner.os }}-${{ hashFiles('obsidian-versions-lock.txt') }}

      - name: Virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y herbstluftwm
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1280x1024x24 +extension GLX -noreset &
          sleep 1
          DISPLAY=:99 herbstluftwm &
          sleep 1

      - name: Run e2e tests (Obsidian minAppVersion, latest, mobile emulation)
        run: npm run test:e2e
